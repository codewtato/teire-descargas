<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reproductor de Teire</title>
<style>
html, body { margin: 0; height: 100%; background: #000; }
iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<script>
// YouTube no reproduce nada si no sabe desde qué página lo llaman, y la app instalada no tiene una
// dirección web. Esta página le da una, y pasa los mensajes del reproductor entre la app y YouTube.
const id = new URLSearchParams(location.search).get("v") ?? "";
if (/^[\w-]{6,20}$/.test(id) && window.parent !== window) {
    const marco = document.createElement("iframe");
    marco.title = "Video";
    marco.allow = "autoplay; encrypted-media; fullscreen; picture-in-picture";
    marco.referrerPolicy = "strict-origin-when-cross-origin";
    marco.src = `https://www.youtube-nocookie.com/embed/${id}?enablejsapi=1&playsinline=1&origin=${encodeURIComponent(location.origin)}`;
    document.body.append(marco);
    addEventListener("message", (e) => {
        if (typeof e.data !== "string") return;
        if (e.source === marco.contentWindow) parent.postMessage(e.data, "*");
        else if (e.source === parent) marco.contentWindow.postMessage(e.data, "*");
    });
}
</script>
</body>
</html>
