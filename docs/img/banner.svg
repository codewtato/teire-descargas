<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-label="Teire: cuidá lo tuyo. Tu día y el de tu gente, en un solo lugar.">
  <defs>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#F4EFE6" fill-opacity=".07"/>
    </pattern>
    <radialGradient id="luz-brote" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#5FD4A0" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5FD4A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz-sol" cx="12%" cy="100%" r="45%">
      <stop offset="0" stop-color="#FFC86B" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFC86B" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="marco"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1280" height="420" fill="#0B0B0C"/>
    <rect width="1280" height="420" fill="url(#puntos)"/>
    <rect width="1280" height="420" fill="url(#luz-brote)"/>
    <rect width="1280" height="420" fill="url(#luz-sol)"/>

    <!-- Logo -->
    <g transform="translate(86 108)">
      <rect width="96" height="96" rx="24" fill="#161618" stroke="#27272B" stroke-width="2"/>
      <g transform="translate(8 8) scale(.2352) translate(-70 -80)">
        <path d="M226 142 V338 a56 56 0 0 0 56 56 h24" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M154 242 H312" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round"/>
        <path d="M368 104 C372 170 338 214 280 214 C276 148 312 104 368 104 Z" fill="#5FD4A0"/>
      </g>
    </g>

    <!-- Texto -->
    <text x="204" y="186" fill="#F4EFE6" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="-4">teire</text>
    <text x="88" y="268" fill="#5FD4A0" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="34" font-style="italic" font-weight="600">Cuidá lo tuyo.</text>
    <text x="88" y="306" fill="#9B9BA1" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19">Tu día y el de tu gente, en un solo lugar.</text>

    <!-- Notas de muestra, pintadas por categoría como en la app -->
    <g filter="url(#sombra)" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
      <g transform="translate(700 70) rotate(-4)">
        <rect width="220" height="150" rx="22" fill="#F7DC8A"/>
        <rect x="18" y="18" width="52" height="20" rx="10" fill="#0B0B0C" fill-opacity=".12"/>
        <text x="30" y="33" fill="#0B0B0C" font-size="11" font-weight="700">Casa</text>
        <text x="18" y="66" fill="#0B0B0C" font-size="17" font-weight="700">Lista del súper</text>
        <rect x="18" y="80" width="12" height="12" rx="3" fill="#0B0B0C" fill-opacity=".8"/>
        <text x="38" y="91" fill="#0B0B0C" fill-opacity=".7" font-size="13">pan</text>
        <rect x="18.8" y="100.8" width="10.4" height="10.4" rx="3" fill="none" stroke="#0B0B0C" stroke-opacity=".6" stroke-width="1.6"/>
        <text x="38" y="111" fill="#0B0B0C" fill-opacity=".7" font-size="13">yerba</text>
        <rect x="18" y="126" width="184" height="5" rx="2.5" fill="#0B0B0C" fill-opacity=".14"/>
        <rect x="18" y="126" width="92" height="5" rx="2.5" fill="#0B0B0C"/>
      </g>
      <g transform="translate(948 52) rotate(3)">
        <rect width="230" height="132" rx="22" fill="#9FD9EC"/>
        <rect x="18" y="18" width="52" height="20" rx="10" fill="#0B0B0C" fill-opacity=".12"/>
        <text x="29" y="33" fill="#0B0B0C" font-size="11" font-weight="700">Ideas</text>
        <text x="18" y="66" fill="#0B0B0C" font-size="17" font-weight="700">Nombres para el perro</text>
        <text x="18" y="90" fill="#0B0B0C" fill-opacity=".7" font-size="13">Mate · Fideo · Chispa</text>
      </g>
      <g transform="translate(790 246) rotate(2)">
        <rect width="250" height="124" rx="22" fill="#161618" stroke="#27272B" stroke-width="2"/>
        <text x="20" y="40" fill="#F4EFE6" font-size="17" font-weight="700">Mapa del viaje</text>
        <path d="M24 96 C60 60 96 110 132 74 S196 70 222 88" fill="none" stroke="#5FD4A0" stroke-width="4" stroke-linecap="round"/>
        <path d="M40 106 L76 84" fill="none" stroke="#FFC86B" stroke-width="4" stroke-linecap="round"/>
        <circle cx="222" cy="88" r="6" fill="#5FD4A0"/>
        <rect x="160" y="54" width="58" height="22" rx="11" fill="#5FD4A0"/>
        <text x="170" y="69" fill="#0B0B0C" font-size="11.5" font-weight="700">@ana</text>
      </g>
      <g transform="translate(1088 236)">
        <circle cx="48" cy="48" r="44" fill="#5FD4A0"/>
        <circle cx="34" cy="34" r="16" fill="#F4EFE6" fill-opacity=".35"/>
        <path d="M58 6 C62 -14 82 -20 96 -14 C92 4 76 12 58 6 Z" fill="#1F9D6E"/>
      </g>
    </g>
  </g>
</svg>
