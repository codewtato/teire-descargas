<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Arrastrás un link hasta la isla de Teire, arriba al centro de la pantalla, y queda guardado">
  <defs>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4EFE6" fill-opacity=".06"/>
    </pattern>
    <radialGradient id="fondo" cx="80%" cy="0%" r="120%">
      <stop offset="0" stop-color="#1f3a2f"/>
      <stop offset=".45" stop-color="#132520"/>
      <stop offset="1" stop-color="#0b1311"/>
    </radialGradient>
    <clipPath id="marco"><rect width="520" height="280" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="520" height="280" fill="url(#fondo)"/>
    <rect width="520" height="280" fill="url(#puntos)"/>

    <!-- Ventana de otro programa -->
    <rect x="70" y="92" width="380" height="220" rx="20" fill="#151D1A" stroke="#28332E" stroke-width="2"/>
    <rect x="92" y="110" width="52" height="10" rx="5" fill="#28332E"/>
    <rect x="92" y="150" width="336" height="12" rx="6" fill="#1C2622"/>
    <rect x="92" y="216" width="200" height="12" rx="6" fill="#1C2622"/>
    <rect x="92" y="240" width="336" height="12" rx="6" fill="#1C2622"/>

    <!-- La isla: quieta (96 x 30), se abre con el aro verde cuando llega el link y confirma "Guardado" -->
    <rect y="14" fill="none" stroke="#5FD4A0" stroke-opacity=".18" stroke-width="10" opacity="0" x="150" width="220" height="46" rx="23">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.46;0.62;0.66;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect fill="#050807" stroke="#F4EFE6" stroke-opacity=".08" x="212" y="14" width="96" height="30" rx="15">
      <animate attributeName="x" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1" keyTimes="0;0.4;0.47;0.62;0.68;0.9;0.96;1" values="212;212;150;150;150;150;212;212"/>
      <animate attributeName="width" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1" keyTimes="0;0.4;0.47;0.62;0.68;0.9;0.96;1" values="96;96;220;220;220;220;96;96"/>
      <animate attributeName="height" dur="6s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1;.3 1 .5 1;0 0 1 1" keyTimes="0;0.4;0.47;0.62;0.68;0.9;0.96;1" values="30;30;46;46;34;34;30;30"/>
      <animate attributeName="rx" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.47;0.62;0.68;0.9;0.96;1" values="15;15;23;23;17;17;15;15"/>
      <animate attributeName="stroke" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.44;0.64;1" values="#F4EFE6;#5FD4A0;#F4EFE6;#F4EFE6"/>
      <animate attributeName="stroke-opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.44;0.64;1" values=".08;1;.08;.08"/>
    </rect>
    <!-- Quieta: la «t» a la izquierda y la lucecita a la derecha -->
    <g>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.43;0.93;0.97;1" values="1;1;0;0;1;1"/>
      <g transform="translate(223 21) scale(0.047) translate(-70 -80)">
        <path d="M226 142 V338 a56 56 0 0 0 56 56 h24" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M154 242 H312" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round"/>
        <path d="M368 104 C372 170 338 214 280 214 C276 148 312 104 368 104 Z" fill="#5FD4A0"/>
      </g>
      <circle cx="292.500" cy="29" r="3.500" fill="#F4EFE6" fill-opacity=".28"/>
    </g>
    <!-- "Soltá para guardar" -->
    <text x="260" y="42" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#5FD4A0" opacity="0">Soltá para guardar
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.46;0.5;0.6;0.63;1" values="0;0;1;1;0;0"/>
    </text>
    <!-- "Guardado · en Guardados" -->
    <g opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.68;0.72;0.88;0.91;1" values="0;0;1;1;0;0"/>
      <circle cx="178" cy="31" r="10" fill="#5FD4A0"/>
      <path d="M173 31.500l3.500 3.500 6.500-7.500" fill="none" stroke="#0F1513" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="196" y="36" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13.500" font-weight="500" fill="#F4EFE6">Guardado <tspan fill="#9AA7A0">en Guardados</tspan></text>
    </g>

    <!-- El link viaja desde la ventana hasta la isla y se achica al soltarlo -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.12;0.5;0.57;0.64;1" keySplines=".45 0 .25 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1"
        values="0 0;0 0;79 -106;79 -106;79 -152;79 -152"/>
      <g transform="translate(181 187)">
        <g>
          <animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite" keyTimes="0;0.57;0.64;1" values="1;1;.3;.3"/>
          <g transform="translate(-181 -187)">
            <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.04;0.6;0.65;1" values="0;1;1;0;0"/>
            <rect x="92" y="168" width="178" height="38" rx="18" fill="#F4EFE6"/>
            <rect x="100" y="176" width="28" height="22" rx="6" fill="#d39a66"/>
            <text x="138" y="192" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#0F1513">Reel de Instagram</text>
          </g>
        </g>
      </g>
    </g>

    <!-- El cursor va arriba de todo: lleva el link hasta la isla, suelta y se va -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.12;0.5;0.57;0.75;1" keySplines=".45 0 .25 1;.45 0 .25 1;0 0 1 1;.45 0 .25 1;0 0 1 1"
        values="0 0;0 0;79 -106;79 -106;150 -40;150 -40"/>
      <g transform="translate(176 182)">
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.04;0.7;0.76;1" values="0;1;1;0;0"/>
        <path d="M5 3l14 9-6.2 1.3L16 20l-2.6 1.2-3.2-6.6L5 19z" transform="scale(1.5)" fill="#F4EFE6" stroke="#0F1513" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>
