<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" role="img" aria-label="Arrastrás un link hasta la burbuja de Teire y queda guardado">
  <defs>
    <radialGradient id="orbe" cx="36%" cy="32%" r="70%">
      <stop offset="0" stop-color="#F4EFE6"/>
      <stop offset=".45" stop-color="#8FE3BC"/>
      <stop offset="1" stop-color="#1F9D6E"/>
    </radialGradient>
    <pattern id="puntos" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F4EFE6" fill-opacity=".06"/>
    </pattern>
  </defs>

  <rect width="520" height="280" rx="28" fill="#0F1513"/>
  <rect width="520" height="280" rx="28" fill="url(#puntos)"/>

  <!-- Ventana de otro programa -->
  <g>
    <rect x="16" y="24" width="300" height="184" rx="24" fill="#151D1A" stroke="#28332E" stroke-width="2"/>
    <rect x="36" y="42" width="52" height="10" rx="5" fill="#28332E"/>
    <rect x="36" y="76" width="260" height="12" rx="6" fill="#1C2622"/>
    <rect x="36" y="100" width="156" height="12" rx="6" fill="#1C2622"/>
    <rect x="36" y="124" width="260" height="12" rx="6" fill="#1C2622"/>
    <rect x="36" y="148" width="210" height="12" rx="6" fill="#1C2622"/>
  </g>

  <!-- El link viaja hasta el centro de la burbuja y se achica: la burbuja se lo come -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.12;0.62;1" keySplines=".45 0 .25 1;.45 0 .25 1;0 0 1 1"
      values="0 0;0 0;297 5;297 5"/>
    <g transform="translate(133 107)">
      <g>
        <animateTransform attributeName="transform" type="scale" dur="6s" repeatCount="indefinite"
          keyTimes="0;0.46;0.62;1" values="1;1;.45;.45"/>
        <g transform="translate(-133 -107)">
          <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.04;0.6;0.66;1" values="0;1;1;0;0"/>
          <rect x="44" y="88" width="178" height="38" rx="18" fill="#1C2622" stroke="#28332E" stroke-width="1.5"/>
          <path d="M62 107h6m6 0h6" fill="none" stroke="#9AA7A0" stroke-width="3" stroke-linecap="round"/>
          <text x="96" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" fill="#F4EFE6">Reel de Instagram</text>
        </g>
      </g>
    </g>
  </g>

  <!-- La burbuja (estilo Brote): crece con el aro punteado, se come el link y muestra el tilde -->
  <g>
    <circle cx="430" cy="112" r="62" fill="none" stroke="#5FD4A0" stroke-width="2" stroke-dasharray="5 6" opacity="0">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.4;0.46;0.64;0.68;1" values="0;0;.9;.9;0;0"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="translate" additive="sum" dur="6s" repeatCount="indefinite"
        keyTimes="0;0.4;0.46;0.64;0.7;1" values="0 0;0 0;-34.4 -9;-34.4 -9;0 0;0 0"/>
      <animateTransform attributeName="transform" type="scale" additive="sum" dur="6s" repeatCount="indefinite"
        keyTimes="0;0.4;0.46;0.64;0.7;1" values="1;1;1.08;1.08;1;1"/>
      <circle cx="430" cy="112" r="50" fill="url(#orbe)"/>
      <path d="M448 66 C452 48 470 42 484 48 C480 64 466 72 448 66 Z" fill="#1F9D6E"/>
      <path d="M414 113l10 10 19-19" fill="none" stroke="#0F1513" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" opacity="0">
        <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.68;0.74;0.92;1" values="0;0;1;1;0"/>
      </path>
    </g>
    <circle cx="430" cy="112" r="50" fill="none" stroke="#5FD4A0" stroke-width="2" opacity="0">
      <animate attributeName="r" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.9;1" values="50;50;76;76"/>
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.9;1" values="0;.6;0;0"/>
    </circle>
  </g>

  <!-- El cursor va arriba de todo: llega al centro de la burbuja, suelta y se va antes de que salga el tilde -->
  <g>
    <animateTransform attributeName="transform" type="translate" dur="6s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.12;0.62;1" keySplines=".45 0 .25 1;.45 0 .25 1;0 0 1 1"
      values="0 0;0 0;297 5;297 5"/>
    <g transform="translate(112 98)">
      <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.04;0.64;0.69;1" values="0;1;1;0;0"/>
      <path d="M5 3l14 9-6.2 1.3L16 20l-2.6 1.2-3.2-6.6L5 19z" transform="scale(1.7)" fill="#F4EFE6" stroke="#0F1513" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- "Guardado · en Guardados" -->
  <g opacity="0">
    <animate attributeName="opacity" dur="6s" repeatCount="indefinite" keyTimes="0;0.72;0.76;0.92;0.96;1" values="0;0;1;1;0;0"/>
    <rect x="318" y="182" width="184" height="30" rx="15" fill="#151D1A" stroke="#28332E" stroke-width="1.5"/>
    <circle cx="336" cy="197" r="5" fill="#5FD4A0"/>
    <text x="348" y="202" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#F4EFE6">Guardado · en Guardados</text>
  </g>

  <text x="260" y="248" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="19" font-weight="600" fill="#F4EFE6">Soltás un link sobre la burbuja y queda guardado</text>
  <text x="260" y="270" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" fill="#9AA7A0">Desde cualquier programa. También texto e imágenes.</text>
</svg>
