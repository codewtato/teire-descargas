<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Imagen para compartir (1200 x 630)</title>
<!-- De acá sale docs/img/compartir.png: se abre a 1200 x 630 y se le saca una captura. -->
<link rel="stylesheet" href="../docs/assets/teire.css">
<style>
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: var(--tinta) radial-gradient(circle at 78% 46%, rgba(95,212,160,.16), transparent 46%); background-image: radial-gradient(circle at 78% 46%, rgba(95,212,160,.16), transparent 46%), radial-gradient(rgba(244,239,230,.05) 1.2px, transparent 1.2px); background-size: auto, 22px 22px; }
.izq { position: absolute; left: 80px; top: 72px; width: 640px; }
.marca { display: flex; align-items: center; gap: 18px; font: 700 40px/1 var(--sans); letter-spacing: -.045em; }
.marca svg { width: 60px; height: 60px; }
h1 { font: 700 76px/1.04 var(--serif); letter-spacing: -.02em; margin: 44px 0 0; }
.lema { font: italic 600 36px/1 var(--serif); color: var(--brote); margin: 40px 0 0; }
.abajo { color: var(--gris); font-size: 23px; margin: 26px 0 0; }
.pantalla { position: absolute; right: 64px; top: 96px; width: 420px; height: 438px; border-radius: 30px; border: 1px solid var(--linea); overflow: hidden; background: radial-gradient(130% 120% at 80% 0%, #1c1c1f 0%, #121214 45%, #0b0b0c 100%); box-shadow: 0 40px 90px -30px rgba(0,0,0,.8); }
.ventana { position: absolute; left: 34px; right: 34px; top: 210px; bottom: -2px; border-radius: 16px 16px 0 0; background: #1a1a1d; border: 1px solid #2e2e33; }
.ventana::before { content: ""; position: absolute; inset: 0 0 auto; height: 34px; border-radius: 16px 16px 0 0; background: #222226; }
.ventana i { position: absolute; left: 22px; top: 62px; width: 62%; height: 12px; border-radius: 6px; background: #2e2e33; }
.ventana i:nth-child(2) { top: 90px; width: 40%; } .ventana i:nth-child(3) { top: 118px; width: 54%; }
.isla { position: absolute; left: 50%; top: 22px; translate: -50% 0; display: flex; align-items: center; justify-content: center; gap: 11px; width: 320px; height: 64px; border-radius: 32px; background: #050505; color: var(--brote); font: 600 21px/1 var(--sans); box-shadow: 0 10px 26px rgba(0,0,0,.4), inset 0 0 0 2px var(--brote), 0 0 0 9px rgba(95,212,160,.16); }
.isla svg { width: 26px; height: 26px; }
.ficha { position: absolute; display: flex; align-items: center; gap: 12px; padding: 12px 20px 12px 12px; border-radius: 18px; background: var(--superficie); border: 1px solid var(--linea); font: 600 20px/1.2 var(--sans); box-shadow: 0 18px 30px -14px rgba(0,0,0,.8); }
.ficha b { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 11px; font-size: 14px; font-weight: 800; color: var(--tinta); }
.f1 { left: 78px; top: 118px; rotate: -3deg; } .f2 { right: 22px; top: 318px; rotate: 2deg; }
.cursor { position: absolute; left: 262px; top: 150px; width: 34px; height: 40px; filter: drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
</style>
</head>
<body>
<div class="izq">
  <div class="marca"><svg viewBox="0 0 512 512"><rect x="20" y="20" width="472" height="472" rx="118" fill="#161618" stroke="#27272B" stroke-width="6"/><g transform="translate(16 6)"><path d="M226 142 V338 a56 56 0 0 0 56 56 h24" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 242 H312" fill="none" stroke="#F4EFE6" stroke-width="56" stroke-linecap="round"/><path d="M368 104 C372 170 338 214 280 214 C276 148 312 104 368 104 Z" fill="#5FD4A0"/></g></svg>teire</div>
  <h1>Lo que encontrás, guardado en un segundo.</h1>
  <p class="lema">Cuidá lo tuyo.</p>
  <p class="abajo">Notas gratis para Windows, Linux, Android y iPhone</p>
</div>
<div class="pantalla">
  <div class="ventana"><i></i><i></i><i></i></div>
  <div class="isla"><svg viewBox="0 0 24 24"><path d="M12 4v11m-4.500-4.500L12 15l4.500-4.500M5 19.500h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Soltá para guardar</div>
  <div class="ficha f1"><b style="background:var(--rosa)">IG</b>Reel de Instagram</div>
  <div class="ficha f2"><b style="background:var(--amarillo)">TXT</b>Receta de chipá</div>
  <svg class="cursor" viewBox="0 0 20 24"><path d="M2 1.500v18.500l5-4.600 3.200 7.100 3.100-1.400-3.100-6.900 6.800-.4z" fill="#fff" stroke="#111" stroke-width="1.300" stroke-linejoin="round"/></svg>
</div>
</body>
</html>
